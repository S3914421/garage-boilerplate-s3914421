packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  # next@16.2.12 still bundles its own old postcss internally (separate from
  # the patched one Tailwind/Vite already use) — force it to a patched
  # version too. postcss 8.x is backward-compatible within the major.
  postcss: '^8.5.18'
  # next also bundles an old sharp (image optimization) — force the patched line.
  sharp: '^0.35.0'
  # eslint pulls js-yaml <4.3.1 via @eslint/eslintrc — CVE-2026-59870 (quadratic
  # CPU consumption in !!omap resolution). Dev-only, but `pnpm audit` fails CI.
  js-yaml: '^4.3.1'
  # next pulls nanoid <3.3.17 via postcss — custom generators loop forever when
  # size is zero (GHSA-2v37-7h3g-55p8). Build-time only, same CI reason.
  nanoid: '^3.3.17'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
